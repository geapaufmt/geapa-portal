name: Portal source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate DEV bootstrap syntax
        run: bash -n scripts/bootstrap-hosting-dev.sh
      - run: npm run verify
      - name: Repeat deterministic build
        run: node scripts/check-reproducible.cjs
