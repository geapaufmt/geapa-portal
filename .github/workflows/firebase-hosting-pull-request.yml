name: Firebase Hosting Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar configuracao HOMOLOG para o preview
        run: node scripts/generate-portal-config.mjs homolog --channel "pr-${{ github.event.number }}" --version "${GITHUB_SHA}"

      - name: Validar configuracao gerada
        run: node --check web/assets/js/config.js

      - name: Publicar preview no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTAL_GEAPA }}
          projectId: portal-geapa
          expires: 7d
