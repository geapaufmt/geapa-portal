name: Firebase Hosting Preview

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR_PREVIEW_DEV para liberar o preview'
        required: true
        type: string
      channel_id:
        description: 'Canal temporario (ex.: pr-123)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preview:
    if: ${{ inputs.confirmacao == 'PUBLICAR_PREVIEW_DEV' }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar configuracao HOMOLOG para o preview
        env:
          FIREBASE_DEV_WEB_CONFIG_JSON: ${{ vars.FIREBASE_DEV_WEB_CONFIG_JSON }}
        run: node scripts/generate-portal-config.mjs homolog --channel "${{ inputs.channel_id }}" --version "${GITHUB_SHA}"

      - name: Validar configuracao gerada
        run: node --check web/assets/js/config.js

      - name: Publicar preview no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEAPA_DEV }}
          projectId: ${{ vars.FIREBASE_DEV_PROJECT_ID }}
          channelId: ${{ inputs.channel_id }}
          expires: 7d
